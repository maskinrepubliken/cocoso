name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The checks only need the npm toolchain, not a Meteor build.
      # patch-package runs in postinstall and needs the patched dependency.
      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (against baseline)
        run: npm run typecheck

      - name: Translation key parity
        run: npm run check:i18n

      - name: Data migrations are all listed in ORDER
        run: npm run check:migrations

      - name: Unused code and dependencies (informational)
        run: npm run check:deps || true

  # A deploy runs the data migrations by itself (scripts/migrations/ORDER), so
  # one that cannot even start must not reach a release. Runs them all, in
  # order and with APPLY set, against an empty MongoDB, twice: the second pass
  # catches a script that fails on a database it has already been through.
  # An empty database only exercises the code outside the per-document loops;
  # this is a smoke test, not a proof that a migration is right.
  migrations:
    name: Data migrations run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
    steps:
      - uses: actions/checkout@v4

      - name: Run every migration twice
        env:
          MONGO: ${{ job.services.mongo.id }}
        run: |
          for i in $(seq 1 30); do
            docker exec "$MONGO" mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          for pass in 1 2; do
            for name in $(node scripts/check-migrations.mjs --list); do
              echo "::group::pass $pass: $name"
              { echo 'var APPLY = true;'; cat "scripts/migrations/$name"; } \
                | docker exec -i "$MONGO" sh -c 'cat > /tmp/m.js && mongosh --quiet cocoso --file /tmp/m.js'
              echo "::endgroup::"
            done
          done
