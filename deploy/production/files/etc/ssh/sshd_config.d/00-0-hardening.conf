# /etc/ssh/sshd_config.d/00-0-hardening.conf
# sshd uses the FIRST value it finds for each option, and the hosting
# provider's image ships 00-hostup-auth.conf (root and password login on).
# This file sorts before it ("00-0" < "00-h"); remove the provider's file too.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# <admin> is the administrator's own account.
AllowUsers <admin> backup-pull deploy
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
