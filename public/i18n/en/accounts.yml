actions:
  signup: Register
  login: Login
  logout: Logout
  forgot: Forgot your password?
  reset: Reset your password
  leave: Leave {{ host }}

login:
  labels:
    title: Login to Your Account
    subtitle: Don't have an account?
  form:
    username:
      label: Username or Email address
    password:
      label: Password
  messages:
    error:
      username: User not found
      password: Incorrect password
    success: You are successfully logged in

logout:
  messages:
    success: You are logged out

signup:
  labels:
    title: Register New Account
    subtitle: Have an account?
    platform: Your account will be global in the platform {{ platform }}. Once you have an account, you can join any of the various communities within the platform.
  form:
    username:
      label: Username
      helper: Minimum 4 characters, only lowercase letters and numbers
      errorNotUnique: The username typed is already taken. Please try another
    email:
      label: Email address
      errorNotUnique: An account with this email address already exists
    password:
      label: Password
      helper: Minimum 8 characters, including at least one lowercase letter, one uppercase letter, and one number
      info: Your password is encrypted
    terms:
      agreement: Agreement
      label: I read and accept {{ terms }}
      terms: the terms of service and privacy policy

password:
  labels:
    title: Reset Password
    subtitle:
      forgot: If you forgot your password, reset it via a link sent to your email.
      reset: Create your desired password
  form:
    email:
      label: Type your email please
  message:
    linkSend: Reset link is sent to your email
    checkMail: Please check your email and see if you received a link to reset your password
    reset: Your password is successfully reset. Now you can login

profile:
  label: Personal Info
  join: Join
  joinHost: Join {{ host }}
  joinAsParticipantQuestion: Would you like to join this organization with the participant role?
  settings: Profile Settings
  image: Profile image
  form:
    avatar:
      label: Profile image
      fileDropper: Click/Drag to upload
      remove: Remove
      changeHelper: To change your profile image, click on the image and choose a file
    firstname:
      label: First name
    lastname:
      label: Last name
    bio:
      label: Bio
    contact:
      label: Contact Info

  message:
    role: You as <bold>{{ username }}</bold> are part of <bold>{{ host }}</bold> community with the <bold>{{ role }}</bold> role
    participant: You are a part of this community. Welcome!
    deny: You are not part of this community.
    notfound: User with this username within this organization not found, or chose to hide their profile
    platform: Information you enter here will be saved globally in the {{ platform }} platform and published in the communities you choose.

  makePublic:
    labelGlobal: Profile is public globally
    label: Profile is public in this community
    helper: If switched on, your profile will be publicly visible in this community
    helperGlobal: If switched off, your profile will be publicly invisible in all communities

  menu:
    avatar: Profile image
    about: About Me
    contact: Contact Info
    language: Language
    options: Options
    privacy: Privacy
    keywords:
      label: Keywords
      description: Here you can select and create some keywords that explains you and your skills well. They will be shown on your profile page, as well as be filterable on the members page.
      placeholder: Type something...

report:
  title: Report {{ username }}
  titleGeneric: Submit a report
  form:
    label: Describe the issue
    placeholder: What happened? Please be as specific as possible…
  messages:
    required: Please describe the issue before submitting.
    success: Report submitted. Thank you.

leave:
  action: Leave Community
  label: Confirm Leaving
  title: Are you sure?
  body: You are about to leave this community and abandon your role and the privileges. You may not be able to retrieve them again. Are you sure?

delete:
  action: Delete Account
  label: Confirm Deletion
  title: Are you sure?
  body: You are about to permanently delete your entire account and all data associated with that. This is an irreversible action. Are you sure?
  successTitle: Account Deletion Scheduled
  successBody: Your account is scheduled to be deleted in a minute. Thank you for being with us. We're sorry to see you go.
  successRedirect: Redirecting to homepage...

emailLogin:
  withPassword: Administrator? Log in with password
  withEmail: Log in with email instead
  title: Log in or sign up
  lead: Enter your email and we'll send you a code. No password needed.
  terms: By continuing you accept
  email:
    label: Email address
    placeholder: name@example.com
    submit: Continue with email
  code:
    title: Check your email
    lead: We've sent a six-digit code to <strong>{{email}}</strong>. Enter it below or use the button in the email.
    label: Code from the email
    digit: Digit {{n}} of 6
    noMail: Nothing there? Check your spam folder, or
    resend: send a new code
    resendIn: you can ask for a new code in {{seconds}} s
    resent: If the address is right, a new email is on its way
    otherEmail: Use another email address
  link:
    busy: Logging in…
    failedTitle: That link no longer works
    newCode: Get a new code
  password:
    title: Log in with password
    lead: Only possible for administrators.
    missing: Fill in both username and password.
    wrong: Wrong username or password.
  errors:
    invalidCode: That code is wrong or has expired. Try again, or ask for a new one.
    invalidEmail: That doesn't look like an email address.
    invalidLink: Login links work once and for 15 minutes. Ask for a new code and you're in.
    tooMany: Too many attempts. Wait a minute and try again.
    sendFailed: We couldn't send the email. Try again in a while.
    passwordDisabled: Passwords are only for administrators. Log in with your email address instead.
