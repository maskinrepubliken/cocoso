# Organizer profiles without a login (imports/api/users/user.alias.js)
alias:
  label: Alias
  noLogin: No login
  invited: Invited
  helper: An alias is an organizer profile without a login, for publishing in someone else's name – an association or a venue. Every administrator can choose it as the organizer of an event or a place.
  cancel: Cancel
  actions:
    edit: Edit the profile
    convert: Turn into an account
    resend: Send the invitation again
    delete: Remove the alias
  create:
    title: Create alias
    intro: The alias gets a page of its own among the organizers. You add a picture and a description in the next step.
    name: Name
    namePlaceholder: e.g. Tranemo Chamber Choir
    contactHelper: Shown on the alias page and on its events, so visitors can reach the organizer. You add a phone number and a website on the profile.
    submit: Create alias
    nameMissing: Give the alias a name
    emailMissing: Add an email address
    emailInvalid: That does not look like an email address
    created: '{{ name }} has been created'
  convert:
    title: Turn {{ name }} into an account
    intro: Hand the profile over to the organizer. With an email address it becomes an ordinary organizer account, with the same page and the same events.
    email: The organizer's email address
    after: We send an invitation to the address. The organizer logs in with a code and accepts the terms the first time. After that it is no longer an alias, and administrators cannot turn it back into one.
    submit: Turn into an account and invite
    emailMissing: Enter the organizer's email address
    converted: '{{ name }} is now an account, and an invitation has been sent to {{ email }}'
    resent: The invitation has been sent to {{ email }} again
    errors:
      invalid-email: That does not look like an email address
      email-in-use: There is already an account with that email address
      email-failed: The invitation could not be sent, so nothing was changed. Try again in a moment.
  delete:
    title: Remove {{ name }}?
    text: The profile and its page are removed. This cannot be undone.
    submit: Remove
    deleted: '{{ name }} has been removed'
    events_one: 'One event that it organizes stays in the calendar, and will say that the organizer has been removed. Only administrators can change it after that.'
    events_other: '{{ count }} events that it organizes stay in the calendar, and will say that the organizer has been removed. Only administrators can change them after that.'
    mirrors_one: 'One mirrored calendar has it as organizer and stops fetching events until you give it another one.'
    mirrors_other: '{{ count }} mirrored calendars have it as organizer and stop fetching events until you give them another one.'

