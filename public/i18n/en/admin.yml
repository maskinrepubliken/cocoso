# Switching whole sections on and off (pages/admin/FeatureSettings.tsx)
features:
  title: Features
  description: Switch whole parts of the site on and off – with care
  warning:
    title: Changes here take effect at once, for everyone
    body: "Switching a feature off removes it from the whole site at once: its pages become \"page not found\", it disappears from the menu, search and the start page, and nobody can create anything new. No content is deleted – switch the feature back on and everything returns. Anyone who already has the site open sees the change only after reloading."
  on: "On"
  off: "Off"
  default: Default
  setBy: "Changed by {{name}} {{when}}"
  menuNote: "Shows in the menu only if its menu item is also switched on under Menu."
  switchOff: Switch off…
  switchOn: Switch on…
  items:
    groups:
      label: Groups
      about: Group pages, the list of groups, joining groups, and the groups' meetings and discussions.
      count_one: "{{count}} group exists"
      count_other: "{{count}} groups exist"
      offEffect: Every group page and the list of groups become "page not found". Nobody can create groups or join them. The groups and their members stay in the database.
      onEffect: The group pages and the list of groups become visible again, with everything they had when the feature was switched off.
    works:
      label: Requests
      about: Requests and offers that residents post, with their list and a page for each.
      count_one: "{{count}} request exists"
      count_other: "{{count}} requests exist"
      offEffect: Every request and their list become "page not found", and nobody can post new ones. The requests stay in the database.
      onEffect: The requests and their list become visible again, with everything they had when the feature was switched off.
    businesses:
      label: Eat, shop & stay
      about: The Eat, shop & stay page and the commercial places' offerings, tagline, contact and opening hours, with their editing from the gear.
      count_one: "{{count}} commercial place"
      count_other: "{{count}} commercial places"
      offEffect: The Eat, shop & stay page becomes "page not found" and its choice leaves the gear. The commercial places are shown as ordinary places under Places, without offerings, tagline or opening hours. Everything stays in the database.
      onEffect: The Eat, shop & stay page is visible again, and the commercial places move back there from Places with their offerings.
    documents:
      label: Documents
      about: Documents on places, requests and groups – adding them from the gear, and the list on the page.
      count_one: "{{count}} document on places, requests and groups"
      count_other: "{{count}} documents on places, requests and groups"
      offEffect: The document list disappears from places, requests and groups, and "Add document" leaves the gear. The documents are kept and come back when the feature is switched on again.
      onEffect: Places, requests and groups show their documents again, and those allowed to add documents see the choice in the gear.
    discussions:
      label: Discussions
      about: The discussions on events, groups and places – the button in the header and unread messages in the account menu.
      count_one: "{{count}} discussion"
      count_other: "{{count}} discussions"
      offEffect: The discussion button leaves every page and unread messages leave the account menu, and no one can write in the discussions. The messages are kept in the database.
      onEffect: The discussions become visible again, with every message they had when the feature was switched off.
  confirm:
    titleOff: "Switch off {{name}}?"
    titleOn: "Switch on {{name}}?"
    type: "Type {{name}} to confirm"
    yesOff: "Switch off {{name}}"
    yesOn: "Switch on {{name}}"
    done: "{{name}} is now {{state}}. The page reloads."
    mismatch: The name does not match – nothing was changed.
