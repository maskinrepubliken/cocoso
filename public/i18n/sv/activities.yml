    label: Beskrivning
    helper: Lägg till en beskrivning av din aktivitet eller bokning
  image:
    label: Bilder
    helper: Välj en eller flera bilder som du vill ska representera ditt evenemang
  resource:
    label: Resurs
    helper: Välj en resurs om evenemanget använder ett rum eller en resurs (bokas då i kalendern). Om arrangemangen inte använder en av era rum/resurser lämnas rutan tom. Valfritt
    holder: Välj
  occurrences:
    label: Datum och tid
    helper: Lägg in start och sluttid för ditt publika evenemang. Vill du skapa flera identiska bokningar eller evenemang som sker vid upprepade tillfällen klickar du på + tecknet.
  days:
    single: Dag
    multiple: Samma aktivitet pågår under flera dagar
  date:
    start: Startdag
    finish: Slutdag
    startFinish: Start och sluttid
  time:
    start: Starttid
    finish: Sluttid
  capacity:
    label: Kapacitet
    helper: Hur många personer kan delta i ditt evenemang?
  details:
    label: Ange detaljer
  place:
    label: Plats
    helper: Valfritt, ange namnet platsen där ditt evenemang kommer äga rum
    holder: Artistosphere
  address:
    label: Adress
    helper: Valfritt, ange adressen till den plats där ditt evenemang kommer äga rum
    holder: 17th Street, Berlin...
  rsvp:
    label: Bokning aktiverad
    helper: Om rutan är vald kan personer boka plats för att delta i evenemanget.
    holder: Välj
  exclusive:
    label: Exklusiv aktivitet (för att undvika konflikter)
    helper: Resursen blockeras i kalendern och andra kan inte inte boka samma resurs samma tid. Klicka av om andra kan använda resursen samtidigt.
    holder: Välj
  submit: Bekräfta och Skapa
  waiting: Skapar din aktivitet...
