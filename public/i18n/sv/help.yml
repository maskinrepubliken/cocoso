# Hjälpsidorna under /om och /guide (imports/ui/pages/help).
# Varje sida har en titel, en ingress och avsnitt. Ett avsnitts `body` är en
# lista där en textrad är ett stycke, `list:` en punktlista, `steps:`
# numrerade steg och `note:` en ruta. I texten fungerar **fetstil** och
# [länkar](/om). {{site}} är sajtens namn.
nav:
  label: Om tjänsten och guidebok
  contents: Innehåll
  groups:
    about: Om tjänsten
    guide: Guidebok


pages:
  about:
    title: Om tjänsten
    lead: "{{site}} samlar det som händer i Tranemo kommun på ett ställe: evenemang, platser att besöka och ställen att äta, handla och bo på."
    sections:
      - title: "Vad är {{site}}?"
        body:
          - "{{site}} är en gemensam kalender för hela kommunen. Här lägger föreningar, studieförbund, företag och kommunens verksamheter själva upp sina evenemang, så att du som bor här eller är på besök hittar dem på ett ställe i stället för på tjugo olika."
          - "Du behöver inget konto för att läsa, söka eller anmäla dig till ett evenemang. Kalendern kostar ingenting och har ingen reklam."
          - list:
              - "**Evenemang** och **Kalender** visar vad som händer, som lista eller månad för månad."
              - "**Platser** är lokaler, mötesplatser och utflyktsmål, med adress, karta och det som händer där."
              - "**Arrangörer** är föreningarna, verksamheterna och eldsjälarna bakom evenemangen."
              - "**Äta, handla & bo** är kaféer, restauranger, butiker och boenden."
          - "Varje ort i kommunen har dessutom en egen sida med det som händer just där."
      - title: Tjänsten är ny
        body:
          - "{{site}} är i betaversion. Vi bygger fortfarande, och saker kan se annorlunda ut från en vecka till nästa. Hittar du något som inte fungerar eller saknar du något? Använd knappen **Ge feedback** längst ner på varje sida."
      - title: Vem står bakom?
        body:
          - "{{site}} drivs av [Uddebo Makerspace](https://www.maskinrepubliken.se/uddebomakerspace/), som också ansvarar för tjänsten och för de personuppgifter som finns i den. Den utvecklas tillsammans med [Maskinrepubliken](https://maskinrepubliken.se/) och i samarbete med [Tranemo kommun](https://www.tranemo.se/)."
          - "Innehållet kommer från arrangörerna själva. Den som har lagt upp ett evenemang eller en plats ansvarar för att uppgifterna stämmer."
          - "Kontakt: Viktor Lyresten, [viktor@lyresten.se](mailto:viktor@lyresten.se), telefon [079-357 72 07](tel:+46793577207)."
      - title: Så blir du arrangör
        body:
          - "Alla som ordnar något i kommunen som är öppet för andra kan bli arrangörer: föreningar, studieförbund, företag, kommunens verksamheter och privatpersoner."
          - steps:
              - "Skapa ett konto under [Logga in](/logga-in). Du behöver bara en e-postadress."
              - "Fyll i din profil med namn och kontaktuppgifter, så att besökare ser vem som ordnar."
              - "Be om att bli arrangör med knappen **Ge feedback** längst ner på sidan. Skriv vilken förening eller verksamhet du företräder och vilken e-postadress kontot har."
              - "När en administratör har godkänt dig får du ett mejl, och sedan kan du lägga upp evenemang direkt."
          - "Hur du gör sedan står i [guideboken](/guide)."
      - title: Upphovsman och licens
        body:
          - "Sajten är gjord av Uddebo Makerspace och Maskinrepubliken."
          - "Den bygger på [Cocoso](https://github.com/eminx/cocoso), fri programvara för föreningar och gemenskaper av Emin Durak med flera. Programmet är licensierat under GNU General Public License version 3 (GPL-3.0). Det betyder att vem som helst får använda, granska och bygga vidare på det, på samma villkor. Källkoden till den här sajten finns på [github.com/maskinrepubliken/cocoso](https://github.com/maskinrepubliken/cocoso)."
          - list:
              - "**3D-ikonerna** kommer från [3dicons.co](https://3dicons.co/) av Vijay Verma och är fria att använda (CC0 1.0). Tranan, sevärdhetsmärket, fotbollen, badringen och tältet är våra egna, gjorda i samma stil."
              - "**Foton** på platser och evenemang har arrangörerna själva lagt upp. Flera foton av platser kommer från Wikimedia Commons och används under licensen Creative Commons Erkännande-DelaLika (CC BY-SA). Fotograf och licens står i texten på sidan där bilden visas."
              - "**Kartorna** bygger på data från [OpenStreetMap](https://www.openstreetmap.org/copyright) (© OpenStreetMaps bidragsgivare, ODbL) och visas med OpenFreeMap och MapLibre."
              - "**Typsnitten** Fraunces och Raleway är fria (SIL Open Font License)."
      - title: Mer att läsa
        body:
          - list:
              - "[Användarvillkor och integritetspolicy](/om/villkor): vad som gäller när du använder tjänsten och vilka uppgifter vi sparar."
              - "[Tillgänglighet](/om/tillganglighet): hur tjänsten fungerar för dig med funktionsnedsättning, och kända brister."
              - "[Guidebok](/guide): för arrangörer och administratörer."

  terms:
    title: Användarvillkor och integritetspolicy
    lead: "Vad som gäller när du använder {{site}} och vilka uppgifter om dig som sparas."
    updated: Gäller från den 20 november 2026.
    sections:
      - title: Vem ansvarar?
        body:
          - "{{site}} drivs av Uddebo Makerspace, som är personuppgiftsansvarig. Kontakt: Viktor Lyresten, [viktor@lyresten.se](mailto:viktor@lyresten.se), telefon [079-357 72 07](tel:+46793577207). Du kan också använda knappen **Ge feedback** längst ner på sidan."
      - title: Villkor
        body:
          - list:
              - "Att läsa, söka och anmäla sig till evenemang kräver inget konto. Ett konto är personligt, och du loggar in med en kod som skickas till din e-postadress."
              - "Det du publicerar syns för alla. Publicera bara sådant som är sant och som du har rätt att publicera, och inga uppgifter om andra utan att de vet om det."
              - "Vi kan ta bort innehåll och stänga av konton som bryter mot lag eller mot de här villkoren."
              - "Tjänsten är i betaversion och kan ändras eller ligga nere."
      - title: Vilka uppgifter vi sparar
        body:
          - list:
              - "**Konto och profil:** e-postadress, användarnamn, namn och det du själv fyller i. Stöd: avtal. Sparas tills du raderar kontot."
              - "**Inloggning:** koden som mejlas till dig sparas i högst 15 minuter, och inloggningen gäller i 90 dagar eller tills du loggar ut. Stöd: avtal."
              - "**Det du publicerar:** evenemang, platser och bilder med ditt användarnamn. Stöd: avtal. Ligger kvar tills du eller en administratör tar bort det."
              - "**Anmälningar:** namn, e-postadress och antal platser. Arrangören och administratörerna ser allt, andra ser bara ditt namn om du inte döljer det. Stöd: avtal. Sparas så länge evenemanget finns kvar. Du ändrar eller tar bort anmälan på evenemangets sida."
              - "**Följda evenemang, pushnotiser och nyhetsbrev:** dina val och, för pushnotiser, en adress hos din webbläsares pushtjänst. Stöd: samtycke. Tas bort när du stänger av dem eller raderar kontot."
              - "**Feedback:** skickas som mejl till administratörerna och sparas inte i tjänsten. Stöd: berättigat intresse."
              - "**Serverloggar och säkerhetskopior:** IP-adress och tidpunkt i loggar, och nattliga kopior av tjänsten som sparas i upp till åtta veckor. Stöd: berättigat intresse av drift och säkerhet."
          - "Vi använder inga uppgifter för statistik, reklam eller spårning och säljer dem inte."
      - title: Vilka som tar del av uppgifterna
        body:
          - "Uppgifterna lagras inom EU. Maskinrepubliken sköter driften som personuppgiftsbiträde åt Uddebo Makerspace. Därutöver används en serverleverantör, en e-posttjänst, din webbläsares pushtjänst om du har slagit på notiser, och karttjänsterna OpenFreeMap och jsDelivr (som ser din IP-adress när en karta visas) samt Nominatim (dit adresser till platser skickas)."
      - title: Kakor
        body:
          - "Bara det som behövs för att tjänsten ska fungera sparas i din webbläsare: kakorna i18next och cocoso-lang för språk (den senare i ett år), cocoso-cookie-notice som i ett år minns att du har läst den här informationen, samt inloggningen och utkast till formulär (i upp till 30 dagar) i webbläsarens lagring. Inga kakor sätts av andra företag och inget används för spårning."
      - title: Dina rättigheter
        body:
          - "Du har rätt att få veta vilka uppgifter vi har om dig och få en kopia, få dem rättade, raderade eller begränsade, invända mot behandlingen, få ut dem i ett flyttbart format och ta tillbaka ett samtycke. Kontakta oss, så svarar vi inom en månad."
          - "Kontot raderar du själv under **Mina inställningar** och **Radera mitt konto**. Evenemang, platser och anmälningar du har lagt upp ligger kvar: ta bort dem först, eller be oss göra det."
          - "Är du inte nöjd kan du klaga hos [Integritetsskyddsmyndigheten](https://www.imy.se/)."

  accessibility:
    title: Tillgänglighet
    lead: "{{site}} ska gå att använda för alla. Här står hur tjänsten uppfyller kraven och vilka brister vi känner till."
    updated: Redogörelsen uppdaterades den 20 november 2026.
    sections:
      - title: Hur tillgänglig är tjänsten?
        body:
          - "Tjänsten är **delvis förenlig** med WCAG 2.1 nivå AA, som är kravet i lagen om tillgänglighet till digital offentlig service."
      - title: Kända brister
        body:
          - list:
              - "**Kalenderns månadsvy** läses inte upp rätt av skärmläsare. Samma evenemang finns som lista på sidan [Evenemang](/evenemang)."
              - "**Kartorna** går inte att använda fullt ut med skärmläsare. Adressen står alltid som text bredvid."
              - "**Bilder** beskrivs bara med evenemangets eller platsens namn."
              - "**Texter som arrangörer skriver** kan ha otydliga länkar och rubriker."
              - "**De inloggade delarna** är inte granskade lika noga som de publika sidorna."
      - title: Så har vi testat
        body:
          - "Vi har granskat de publika sidorna själva i november 2026, med verktyget axe-core och för hand med tangentbord, i 200 procents förstoring och på smal skärm. Ingen granskning med skärmläsare och ingen oberoende granskning har gjorts."
      - title: Rapportera brister
        body:
          - "Fungerar något inte för dig, eller behöver du innehåll i ett annat format? Använd knappen **Ge feedback** längst ner på sidan, eller kontakta Viktor Lyresten på Uddebo Makerspace: [viktor@lyresten.se](mailto:viktor@lyresten.se), telefon [079-357 72 07](tel:+46793577207)."
          - "Är du inte nöjd med vårt svar kan du [anmäla det till DIGG](https://www.digg.se/tdosanmalan), som har tillsyn över lagen."

  guideStart:
    title: Guidebok
    lead: "För dig som arrangerar evenemang, tar hand om en plats eller administrerar {{site}}. Steg för steg, med samma ord som står på knapparna."
    sections:
      - title: Kom igång på fem minuter
        body:
          - steps:
              - "**Skapa ett konto.** Tryck på **Logga in** längst ner på sidan och skriv din e-postadress. Mer under [Konto och att bli arrangör](/guide/konto)."
              - "**Bli arrangör.** Be en administratör godkänna dig, med knappen **Ge feedback**. Du får ett mejl när det är klart."
              - "**Fyll i din profil.** Namn, bild och en e-postadress eller ett telefonnummer som besökare kan nå dig på. Det krävs för att kunna publicera. Mer under [Din profil](/guide/din-sida)."
              - "**Lägg upp ditt första evenemang.** Gå till **Evenemang** och tryck på plusknappen uppe i sidhuvudet. Mer under [Skapa ett evenemang](/guide/evenemang)."
      - title: Kapitlen
        body:
          - list:
              - "[Konto och att bli arrangör](/guide/konto): logga in, bli godkänd, få notiser och ha sajten som app."
              - "[Skapa ett evenemang](/guide/evenemang): fälten i formuläret, ett i taget."
              - "[Sköta ett evenemang](/guide/hantera-evenemang): ändra, meddela de anmälda, se anmälningar, ställa in och ta bort."
              - "[Platser](/guide/platser): lägga upp en lokal eller ett utflyktsmål, och Äta, handla & bo."
              - "[Din profil](/guide/din-sida): det besökare ser om dig, dina inställningar och din översikt."
              - "[För administratörer](/guide/administratorer): användare, orter, speglingar, utskick och inställningar."
      - title: Tre saker som är bra att veta
        body:
          - list:
              - "**Det du sparar publiceras direkt.** Ingen granskar i förväg. Du kan alltid ändra efteråt."
              - "**Formulären minns det du skrivit.** Stänger du ett formulär utan att spara ligger utkastet kvar i din webbläsare i upp till 30 dagar. Bilder som inte hann sparas behöver du lägga till igen."
              - "**Fråga oss.** Knappen **Ge feedback** finns längst ner på varje sida och går till administratörerna."

  guideAccount:
    title: Konto och att bli arrangör
    lead: "Du loggar in med din e-postadress och en kod, utan lösenord. För att lägga upp evenemang behöver en administratör godkänna dig som arrangör."
    sections:
      - title: Skapa ett konto och logga in
        body:
          - steps:
              - "Tryck på **Logga in** längst ner på sidan. På en telefon finns den också i menyn."
              - "Skriv din e-postadress och tryck på **Fortsätt med e-post**."
              - "Du får ett mejl med en sexsiffrig kod. Skriv in koden, eller tryck på knappen i mejlet. Koden gäller i 15 minuter och fungerar en gång."
              - "Första gången får du frågan om du vill skapa ett konto. Kryssa i att du godkänner villkoren och tryck på **Skapa mitt konto**."
          - "Kommer inget mejl? Titta i skräpposten, eller tryck på **skicka en ny kod**. Nästa gång loggar du in på samma sätt med samma adress."
          - note: "Dela en adress, inte ett konto. Är ni flera i en förening som ska lägga upp evenemang skapar var och en ett eget konto. Ni kan sedan stå som medarrangörer till samma evenemang."
      - title: Bli arrangör
        body:
          - "Ett nytt konto kan följa evenemang och få notiser, men inte publicera. För det behöver en administratör godkänna dig."
          - steps:
              - "Tryck på **Ge feedback** längst ner på sidan."
              - "Skriv vilken förening eller verksamhet du företräder och vilken e-postadress du har loggat in med."
              - "När du är godkänd får du mejlet **Du är nu arrangör**, med en knapp som tar dig direkt till formuläret för ett nytt evenemang."
          - "Som arrangör ser du en plusknapp uppe i sidhuvudet på sidorna Evenemang och Platser, och du visas på sidan **Arrangörer**."
      - title: Notiser och sajten som app
        body:
          - "Under **Mina inställningar** (tryck på din profilbild i sidhuvudet) väljer du vad du vill få:"
          - list:
              - "**Evenemang du följer:** mejl och pushnotis när tid eller plats ändras, eller när arrangören skickar en uppdatering."
              - "**Nyhetsbrev:** nyheter från {{site}} då och då. Avstängt från början."
              - "**Den här enheten:** pushnotiser slås på för varje telefon eller dator för sig, med **Slå på pushnotiser här**."
          - "Vill du ha {{site}} som en app på telefonen? Tryck på **Som app** längst ner på sidan och följ stegen. På en iPhone måste sidan ligga på hemskärmen för att notiser ska fungera."
      - title: Logga ut och radera kontot
        body:
          - "**Logga ut** finns i menyn vid din profilbild och längst ner på sidan."
          - "**Radera mitt konto** finns sist under **Mina inställningar**. Vad som tas bort och vad som ligger kvar står i [integritetspolicyn](/om/villkor)."

  guideEvents:
    title: Skapa ett evenemang
    lead: "Titel, bild, tid och plats räcker. Det tar ett par minuter, och evenemanget syns i kalendern så fort du trycker på Publicera."
    sections:
      - title: Öppna formuläret
        body:
          - "Gå till **Evenemang** och tryck på den runda plusknappen uppe i sidhuvudet, bredvid sökknappen. Knappen syns bara när du är inloggad som arrangör. Du kan också trycka på **Lägg till** på kortet sist i listan, eller på **Ny aktivitet** i din översikt."
      - title: Det viktigaste
        body:
          - list:
              - "**Titel.** Evenemangets namn, som det ska stå i kalendern. Skriv inte datum eller plats här, de visas ändå."
              - "**Undertitel** (valfritt). En rad om vad det handlar om."
              - "**Bilder.** Minst en bild krävs. Den första blir huvudbild, och du drar bilderna för att ändra ordningen. Använd bara bilder du har rätt att använda, och skriv fotografens namn i beskrivningen om licensen kräver det. Undvik bilder med mycket text: skriv hellre texten i beskrivningen, så kan alla läsa den."
              - "**Tillfällen.** Datum, när det börjar och när det slutar. Tryck på **Ändra till flera dagar** för något som pågår över flera dagar."
              - "**Beskrivning.** Vad som händer, vem det passar för, vad det kostar och vad man ska ta med. Skriv länkar så att det framgår vart de leder."
      - title: Evenemang som återkommer
        body:
          - "Tryck på **Lägg till tillfälle** för varje gång evenemanget äger rum. Det nya tillfället får samma tider som det förra, en vecka senare, så för något som sker varje vecka trycker du bara en gång per vecka."
          - "Ser kalendern att tillfällena kommer varje eller varannan vecka märker den själv evenemanget med till exempel **Varje torsdag**."
      - title: Typ av evenemang
        body:
          - "Välj en eller flera: Kultur, Idrott, Barn & familj, Bio, Senior, Natur, Lärande eller Umgänge. Besökare filtrerar på dem, så välj det som verkligen stämmer."
      - title: Arrangör och kontaktuppgifter
        body:
          - "Du står som arrangör. Med **Lägg till medarrangör** lägger du till andra arrangörer som står bakom evenemanget. De kan också ändra det och se anmälningarna."
          - "Under **Kontaktuppgifter** väljer du vad besökare ska se: **Standard** är de publika uppgifterna i din profil, och med **Andra uppgifter** skriver du en kontaktperson, e-post, telefon eller webbplats bara för det här evenemanget."
          - note: "Alla arrangörer måste ha en e-postadress eller ett telefonnummer i sin profil. Annars går evenemanget inte att spara."
      - title: Plats
        body:
          - list:
              - "**Välj en plats.** Sök bland platserna som redan finns i kalendern. Det är det bästa valet: evenemanget syns då på platsens sida, och adress och karta följer med."
              - "**Arrangörens adress.** Adressen hämtas från din profil."
              - "**Annan adress.** Skriv adressen själv och välj vilken ort i kommunen det gäller."
          - "Saknas platsen? Lägg upp den först, se [Platser](/guide/platser)."
      - title: Bokning och anmälan
        body:
          - "Slå på **Anmälan är möjlig** om besökare ska anmäla sig på evenemangets sida, och ange **Kapacitet**: hur många som kan anmäla sig till varje tillfälle. När det är fullt stängs anmälan av sig själv."
          - "Besökare anmäler sig med namn och e-postadress, utan konto. Bara du, dina medarrangörer och administratörerna ser e-postadresserna."
      - title: Publicera
        body:
          - "Tryck på **Publicera**. Evenemanget syns direkt i kalendern, på platsens sida och i din profil. Blev något fel ändrar du det efteråt, se [Sköta ett evenemang](/guide/hantera-evenemang)."

  guideManage:
    title: Sköta ett evenemang
    lead: "Ändra, meddela dem som kommer, se vilka som har anmält sig och ställ in eller ta bort."
    sections:
      - title: Ändra ett evenemang
        body:
          - "Öppna evenemangets sida. Tryck på kugghjulet uppe i sidhuvudet (**Hantera**) och välj **Redigera evenemang**, ändra och tryck på **Uppdatera**."
          - "Om någon är anmäld eller följer evenemanget får du frågan **Meddela de som kommer?** när du sparar:"
          - list:
              - "**Spara och meddela** skickar mejl och pushnotis till alla anmälda och alla som följer. Har du ändrat tid eller plats står det i meddelandet av sig självt, och du kan lägga till några egna ord."
              - "**Spara utan att meddela** sparar tyst. Använd det för stavfel och småsaker, inte när tid eller plats ändras."
          - "Meddelandet går iväg några minuter efter att du sparat. Sparar du flera gånger i rad blir det ändå bara ett meddelande."
      - title: Skicka en uppdatering
        body:
          - "Under **Skicka en uppdatering** på evenemangets sida skriver du ett kort meddelande, till exempel att ni samlas vid en annan ingång. Det går med mejl och pushnotis till alla som är anmälda eller följer, och visas på sidan under **Nytt från arrangören**."
      - title: Se anmälningarna
        body:
          - "På evenemangets sida finns avsnittet **För arrangören**, som bara du, dina medarrangörer och administratörerna ser. Där står förnamn, efternamn, e-post och antal för varje tillfälle."
          - "**Ladda ner CSV** ger listan för det valda tillfället som en fil att öppna i Excel eller ett annat kalkylprogram. Listan innehåller personuppgifter: dela den inte vidare, och radera filen när evenemanget är över."
          - "I din översikt (**Hem** i adminpanelen) ser du nya anmälningar från den senaste veckan och hur fullt det är på det som är på gång."
      - title: Ställa in
        body:
          - "Tryck på **Ställ in evenemang** under **För arrangören**. Skriv gärna varför. Evenemanget ligger kvar i listorna, märkt **Inställt**, anmälan stängs och alla som är anmälda eller följer får ett mejl."
          - "Blir det av ändå trycker du på **Återuppta evenemang**."
          - "Det går inte att ställa in ett enskilt tillfälle. Ta i stället bort tillfället i formuläret (**Ta bort tillfälle**), välj **Spara och meddela** och förklara vad som gäller."
      - title: Arkivera och ta bort
        body:
          - "**Arkivera evenemanget** tar bort det från kalendern utan att radera det. Arkiverade evenemang ser bara du och administratörerna, under **Arkiverade** i din profil, och du kan välja **Återställ från arkivet**."
          - "För att radera för gott arkiverar du först och väljer sedan **Ta bort evenemanget**. Då försvinner också alla anmälningar, och det går inte att ångra."
      - title: Evenemang som hämtas från en annan kalender
        body:
          - "Vissa evenemang hämtas automatiskt, till exempel från biblioteket och bion. De uppdateras från källan varje timme, så ändringar ska göras där. Anmälan sker också hos källan."
          - "Vill du ta över ett sådant evenemang och ändra det här väljer du **Koppla loss**. Då uppdateras det inte längre från källan."

  guidePlaces:
    title: Platser
    lead: "En plats är en lokal, en mötesplats eller ett utflyktsmål. Den har en egen sida med adress, karta och det som händer där, och den går att välja när någon skapar ett evenemang."
    sections:
      - title: Lägga upp en plats
        body:
          - "Gå till **Platser** och tryck på plusknappen uppe i sidhuvudet (**Ny plats**). Sök först, så att platsen inte redan finns."
          - list:
              - "**Namn.** Det som platsen kallas i dagligt tal."
              - "**Bilder** (valfritt). Samma regler som för evenemang: bara bilder du har rätt att använda, med fotograf och licens i beskrivningen när det krävs."
              - "**Beskrivning.** Vad som finns där, hur man tar sig dit, om det går att komma in med rullstol, om det finns parkering och toalett."
              - "**Typ av plats.** Kultur & mötesplatser, Sevärdheter, Idrottshallar, Idrottsplatser, Bad eller Friluftsliv."
      - title: Var platsen finns
        body:
          - list:
              - "**Adress.** Skriv adressen, eller klicka på kartan och dra nålen dit platsen är, så fylls resten i. En badplats eller ett vindskydd utan gatuadress sätter du ut på kartan. Välj också **Ort**, den del av kommunen platsen hör till."
              - "**Del av en annan plats.** För ett rum eller en sal i ett större hus, som en hörsal i biblioteket. Platsen får då det större husets adress."
      - title: Förvaltare och kontakt
        body:
          - "**Förvaltare** är de arrangörer som tar hand om platsen och kan ändra den. Lägger du upp en plats behöver du själv vara en av förvaltarna. Administratörer kan alltid ändra."
          - "Under **Kontakt** väljer du vem man frågar om platsen: en av förvaltarna, eller andra uppgifter."
      - title: Platser som går att boka
        body:
          - "Slå på **Platsen går att boka** och berätta hur: vem man kontaktar, eller en **Länk** till ett bokningssystem. Platsen märks då **Bokningsbar** och går att hitta med filtret på sidan Platser. Själva bokningen sker hos dig, inte i kalendern."
      - title: Ändra en plats
        body:
          - "Öppna platsens sida, tryck på kugghjulet och välj **Redigera plats**. Rättar du adressen ändras den också på alla evenemang som hålls där."
          - "Bara administratörer kan ta bort en plats, och bara när den inte har några kommande evenemang."
      - title: Äta, handla & bo
        body:
          - "Kaféer, restauranger, butiker och boenden visas på sidan **Äta, handla & bo**. Det är vanliga platser med några uppgifter till."
          - steps:
              - "Lägg upp stället som en plats, som ovan."
              - "Öppna platsens sida, tryck på kugghjulet och välj **Äta, handla & bo**."
              - "Slå på **Aktivera Äta, handla & bo**. Skriv en **Tagline**, en rad under namnet, till exempel Surdegsbageri och kafé."
              - "Fyll i **Öppettider** för veckan. Under **Om öppettiderna** skriver du undantag, som semesterstängt."
              - "Lägg till ett eller flera **Erbjudanden**: Mat & fika, Boende, Tjänster eller Försäljning. Ett erbjudande kan ha egna öppettider."
              - "Tryck på **Spara**."
          - "På platsens sida visas sedan öppettiderna och om det är öppet just nu."

  guideProfile:
    title: Din profil
    lead: "Din profil är det besökare ser om dig eller din förening: vem ni är, hur man når er och vad ni har på gång."
    sections:
      - title: Fylla i profilen
        body:
          - "Tryck på din profilbild uppe i sidhuvudet och välj **Redigera min profil**."
          - list:
              - "**Namn.** Föreningens eller verksamhetens namn om du arrangerar i dess namn, annars ditt eget."
              - "**Profilbild.** En logotyp eller ett foto. Klicka på bilden för att byta."
              - "**Beskrivning.** Några rader om vilka ni är och vad ni gör."
              - "**Publika kontaktuppgifter.** E-post, telefon och webbplats. De visas i din profil och vid varje evenemang du arrangerar. Som arrangör måste du ange en e-postadress eller ett telefonnummer."
              - "**Hemvist.** Där du eller föreningen brukar hålla till: en plats i kalendern eller en egen adress. Nya evenemang utgår från den."
          - "Tryck på **Uppdatera** för att spara."
          - note: "Tänk på att kontaktuppgifterna är publika. Använd föreningens adress och nummer hellre än dina privata."
      - title: Det här visas i din profil
        body:
          - "Namn, bild, beskrivning och kontaktuppgifter, dina kommande och tidigare evenemang och de platser du förvaltar. Arkiverade evenemang ser bara du och administratörerna."
          - "Arrangörer visas på sidan **Arrangörer**. Vill du inte synas där kan en administratör dölja din profil."
      - title: Mina inställningar
        body:
          - "Tryck på din profilbild och välj **Mina inställningar**. Där finns:"
          - list:
              - "**Språk:** språket du ser sidan på och får mejl på."
              - "**Evenemang du följer:** om du vill ha mejl och pushnotiser, och listan över det du följer."
              - "**Nyhetsbrev.**"
              - "**Den här enheten:** pushnotiser för just den här telefonen eller datorn, och **Skicka en testnotis**."
              - "**Radera mitt konto.**"
      - title: Din översikt
        body:
          - "Tryck på ditt namn längst ner på sidan, efter **Inloggad som**, så kommer du till din översikt. Där ser du nya anmälningar från den senaste veckan och dina evenemang de närmaste två veckorna, med hur många som är anmälda."
          - "Därifrån når du också **Ny aktivitet** och **Öppna kalendern**."

  guideAdmin:
    title: För administratörer
    lead: "Adminpanelen är till för kommunens och Uddebo Makerspaces administratörer. Här godkänner du arrangörer, sköter orter och speglingar och ställer in hur sajten ser ut."
    sections:
      - title: Hitta dit
        body:
          - "Tryck på din profilbild uppe i sidhuvudet och välj **Adminpanel**. Menyn till vänster har samma rubriker som avsnitten här. Överst tar sajtens namn dig tillbaka till den publika sidan."
          - "**Hem** är din överblick: nya evenemang, nya medlemmar, nya platser och vad som har hämtats från andra kalendrar."
      - title: Användare
        body:
          - "Här godkänner du arrangörer. Leta upp personen med sökfältet och välj i menyn på raden:"
          - list:
              - "**Verifiera** ger rätt att lägga upp evenemang och platser. Personen får mejlet **Du är nu arrangör**."
              - "**Gör till arrangör** visar personen på sidan Arrangörer. Det ger inga rättigheter i sig, så för en ny arrangör gör du oftast båda."
              - "**Avverifiera** tar tillbaka rätten att publicera. Det som redan är publicerat ligger kvar."
              - "**Ställ in som admin** ger full tillgång till adminpanelen. Var sparsam med det."
              - "**Dölj profilen för andra** tar bort personen från Arrangörer och gör profilen osynlig för besökare."
              - "**Visa evenemang** listar allt personen arrangerar eller är medarrangör till, med länkar till evenemangen."
              - "**Visa sajten som den här användaren** låter dig se det personen ser, till exempel för att hjälpa någon som har kört fast. Du går tillbaka med **Tillbaka till mitt konto**."
          - note: "Kontrollera att du vet vem personen är och vilken förening eller verksamhet det gäller innan du verifierar. Allt en arrangör publicerar syns direkt, utan granskning."
      - title: Alias
        body:
          - "Ett alias är en arrangörsprofil utan inloggning. Använd det för att publicera åt en förening eller verksamhet som inte har något eget konto. Det har en egen sida bland arrangörerna, och ingen kan logga in som det."
          - list:
              - "**Skapa alias**, ovanför listan under Användare, frågar efter ett namn och en e-postadress för besökare. Sedan öppnas profilen, så att du kan lägga till telefon, bild och beskrivning."
              - "**Välj aliaset** som arrangör när du lägger upp ett evenemang, med **Byt** under arrangören. Du kan också lägga till det som medarrangör, som ansvarig för en plats och som arrangör för en speglad kalender. Alla administratörer kan använda alla alias, andra arrangörer kan det inte."
              - "**Omvandla till konto** lämnar över profilen till arrangören. Ange arrangörens e-postadress, så får hen en inbjudan, loggar in med kod och godkänner villkoren. Sidan och evenemangen ligger kvar. Sedan är det ett vanligt arrangörskonto och inte längre ett alias."
              - "**Ta bort aliaset** tar bort profilen och dess sida. Dess evenemang ligger kvar i kalendern, precis som när någon raderar sitt konto: har ett evenemang en medarrangör blir den arrangör, på de övriga står det att arrangören är borttagen. **Visa evenemang** listar dem, så att du kan byta arrangör först."
          - note: "Skapa bara ett alias åt någon som känner till det, och publicera bara det de har bett om. Kontaktuppgifterna du anger visas för alla besökare."
      - title: Hålla ordning på innehållet
        body:
          - "Som administratör kan du ändra och ta bort alla evenemang och platser, med kugghjulet på respektive sida. Du kan också byta arrangör på ett evenemang."
          - "Synpunkter från besökare kommer med **Ge feedback** och går som mejl till alla administratörer. Bestäm vem av er som svarar."
          - "När någon ber om att få sina uppgifter raderade: ta bort personens evenemang, platser och anmälningar som inte ska ligga kvar. Kontot raderar personen själv under Mina inställningar."
      - title: Orter
        body:
          - "Varje ort i kommunen har en egen startsida. Med **Ny ort** lägger du till en, med namn, adress (den del av webbadressen som kommer efter snedstrecket), beskrivning, bild och färg. Dra raderna för att ändra ordningen."
          - "En ort syns först när den är **Publicerad**. Under **Innehåll på startsidan** kan du lägga till en komponerbar sida med egen text och egna bilder. En ort kan bara raderas när inget innehåll hör till den."
      - title: Speglingar
        body:
          - "En spegling hämtar evenemang från en annan kalender en gång i timmen. I dag finns två sorters källor: bibliotekets evenemang (Axiell-kalender) och bioföreställningar från bio.se."
          - "Med **Ny spegling** anger du källan, vilken **Plats** evenemangen hålls på och vilket konto som står som **Arrangör**. Kontot behöver e-post eller telefon i sin profil."
          - "Tryck på **Förhandsgranska** innan du slår på en ny spegling, så ser du vad som skulle hämtas. **Synka nu** hämtar direkt. På varje rad står hur den senaste hämtningen gick: hur många nya, ändrade och borttagna, eller varför den misslyckades."
      - title: Utskick
        body:
          - "**Skicka ett nyhetsbrev** går till dem som har valt nyhetsbrevet i sina inställningar. Antalet står överst. Skriv ämne och innehåll, bifoga gärna evenemang och platser, och titta på **Förhandsvisa** innan du skickar. Det går inte att ångra ett utskick."
          - "Under **Automatiserade e-postmeddelanden** ändrar du texten i mejlen som går ut när någon verifieras eller blir administratör."
      - title: Inställningar
        body:
          - list:
              - "**Organisation:** sajtens namn, logotyp, kontaktuppgifter, språk och texten i sidfoten."
              - "**Meny:** ordningen i huvudmenyn och vilka sidor som finns med."
              - "**Design:** färger och menyns utseende. Håll god kontrast mellan text och bakgrund, så att alla kan läsa."
              - "**Funktioner:** slår på och av hela delar av sajten. En avstängd del försvinner för alla besökare, men innehållet finns kvar och kommer tillbaka när du slår på den igen."
          - "Under **Listningssidor** ändrar du namn och beskrivning på sidorna Evenemang, Kalender, Arrangörer och Platser, och under **Komponerbara sidor** bygger du egna sidor av text, bilder och knappar."
      - title: Personuppgifter och ansvar
        body:
          - "Som administratör ser du e-postadresser och anmälningslistor. Använd dem bara för att sköta kalendern, lämna inte ut dem och ladda inte ner mer än du behöver."
          - "Vad som sparas och hur länge står i [integritetspolicyn](/om/villkor), och vad som gäller för tillgänglighet i [tillgänglighetsredogörelsen](/om/tillganglighet). Ändrar ni hur tjänsten fungerar behöver de texterna också ändras."
