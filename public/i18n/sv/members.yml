works:
  label: Mina förfrågningar
  # The request form's cards (pages/works/WorkForm.tsx)
  form:
    kind: Vad gäller det?
    kindHelper: Välj det som passar bäst – det avgör var förfrågan syns och vilken bild den får.
    kindMissing: Välj vad förfrågan gäller
    where: Var
    contact: Kontakt
    contactHelper: Valfritt. Hur andra når dig om just det här, till exempel ett telefonnummer. Visas under rubriken.
    profile: Visa länk till min profil
    profileHelper: Andra kan då gå till din profil och nå dig därifrån.
    extra: Bra att veta
    extraHelper: Valfritt, t.ex. när, var och hur länge.

  title:
    label: Titel
    holder: t.ex. Samåkning till Borås på vardagar…
    helper: Ange en titel
  shortDescription:
    label: Kort beskrivning
    holder: en mening om vad du erbjuder eller söker…
    helper: Valfritt, lägg till en kort beskrivning
  category:
    label: Typ av förfrågan
    holder: Välj alternativ eller skriv för att skapa en ny
    helper: Välj Samåkning, Låna ut, Vill låna, Ge bort eller Hjälp sökes.
  longDescription:
    label: Beskrivning
    holder: Plats för en längre beskrivande text…
    helper: Lägg till en längre beskrivning
  extra:
    label: Ytterligare info
    holder: t.ex. när, var och hur länge…
    helper: Lägg till eventuell extra information. Det kan exempelvis vara prisuppgifter eller liknande. Information hamnar under fliken ”extra”.
  contact:
    label: Kontaktinfo
    holder: minepost@mindoman.com
    helper: Om du vill kan du ange kontaktuppgifterna som kan användas för att kommunicera om detta objekt. Om du föredrar att det inte visas, vänligen ta bort standardvärdet.
  image:
    label: Bilder
    helper: Valfritt, välj en eller flera bilder som du vill ska representera ditt inlägg
  avatar:
    label: Visa din avatar
    helper: Visa din avatar vid det här inlägget
  documents:
    label: Dokument
    helper: Dokument uppladdade för detta inlägg
    newNotice: För dokumentuppladdning, skapa först posten och gå sedan till redigeringssidan för att ladda upp dokument

