# Organizer profiles without a login (imports/api/users/user.alias.js)
alias:
  label: Alias
  noLogin: Ingen inloggning
  invited: Inbjuden
  helper: Ett alias är en arrangörsprofil utan inloggning, för att publicera i någon annans namn – en förening eller en verksamhet. Alla administratörer kan välja det som arrangör för ett evenemang eller en plats.
  cancel: Avbryt
  actions:
    edit: Redigera profilen
    convert: Omvandla till konto
    resend: Skicka inbjudan igen
    delete: Ta bort aliaset
  create:
    title: Skapa alias
    intro: Aliaset får en egen sida bland arrangörerna. Bild och beskrivning lägger du till i nästa steg.
    name: Namn
    namePlaceholder: t.ex. Tranemo kammarkör
    contactHelper: Visas på aliasets sida och vid dess evenemang, så att besökare kan nå arrangören. Telefon och webbplats lägger du till i profilen.
    submit: Skapa alias
    nameMissing: Ge aliaset ett namn
    emailMissing: Ange en e-postadress
    emailInvalid: Det ser inte ut som en e-postadress
    created: '{{ name }} har skapats'
  convert:
    title: Omvandla {{ name }} till konto
    intro: Lämna över profilen till arrangören. Med en e-postadress blir den ett vanligt arrangörskonto, med samma sida och samma evenemang.
    email: Arrangörens e-postadress
    after: Vi skickar en inbjudan till adressen. Arrangören loggar in med kod och godkänner villkoren första gången. Sedan är det inte längre ett alias, och administratörer kan inte göra om det till ett.
    submit: Omvandla och bjud in
    emailMissing: Ange arrangörens e-postadress
    converted: '{{ name }} är nu ett konto, och en inbjudan har skickats till {{ email }}'
    resent: Inbjudan har skickats till {{ email }} igen
    errors:
      invalid-email: Det ser inte ut som en e-postadress
      email-in-use: Det finns redan ett konto med den e-postadressen
      email-failed: Inbjudan kunde inte skickas, så inget ändrades. Försök igen om en stund.
  delete:
    title: Ta bort {{ name }}?
    text: Profilen och dess sida tas bort. Det går inte att ångra.
    submit: Ta bort
    deleted: '{{ name }} har tagits bort'
    inUse: '{{ name }} arrangerar fortfarande {{ events }} evenemang och {{ mirrors }} speglade kalendrar. Ge dem en annan arrangör först.'

