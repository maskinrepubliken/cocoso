actions:
  signup: Registrera
  login: Logga in
  logout: Logga ut
  forgot: Glömt ditt lösenord?
  reset: Återställ ditt lösenord

login:
  labels:
    title: Logga in på ditt konto
    subtitle: Har du inget konto?
  form:
    username:
      label: Användarnamn eller e-postadress
    password:
      label: Lösenord
  messages:
    error:
      username: Användaren hittades inte
      password: Fel lösenord
    success: Du har loggat in

logout:
  messages:
    success: Du är utloggad

signup:
  labels:
    title: Registrera nytt konto
    subtitle: Har ett konto?
    platform: Ditt konto kommer att vara globalt i plattformen {{ platform }}. När du har ett konto kan du gå med i plattformens olika communities.
  form:
    username:
      label: Användarnamn
      helper: Minst 4 tecken, endast små bokstäver och siffror
      errorNotUnique: Det angivna användarnamnet är redan upptaget. Försök med ett annat
    email:
      label: E-postadress
      errorNotUnique: Ett konto med den här e-postadressen finns redan
    password:
      label: Lösenord
      helper: Minst 8 tecken, inklusive minst en liten bokstav, en stor bokstav och en siffra
      info: Ditt lösenord är krypterat
    terms:
      agreement: Avtal
      label: Jag läser och accepterar {{ terms }}
      terms: användarvillkoren och sekretesspolicyn

password:
  labels:
    title: Återställ lösenord
    subtitle:
      forgot: Om du har glömt ditt lösenord, återställ det via länken som skickas till din e-post.
      reset: Skapa ditt nya lösenord
  form:
    email:
      label: Vänligen ange din e-post
  message:
    linkSend: Återställningslänk skickas till din e-post
    checkMail: Kontrollera din e-post och se om du har fått en länk för att återställa ditt lösenord
    reset: Ditt lösenord har återställts. Nu kan du logga in

profile:
  label: Personlig information
  settings: Profilinställningar
  image: Profilbild
  form:
    avatar:
      label: Profilbild
      fileDropper: Klicka/dra för att ladda upp
      remove: Ta bort
      changeHelper: För att ändra din profilbild, klicka på bilden och välj en fil
    firstname:
      label: Förnamn
    lastname:
      label: Efternamn
    bio:
      label: Bio
    contact:
      label: Kontaktinformation

  message:
    role: Du som <bold>{{ username }}</bold> är en del av <bold>{{ host }}</bold> community med rollen <bold>{{ role }}</bold>
    deny: Du är inte en del av denna organisation.
    notfound: Användare med detta användarnamn inom denna organisation hittades inte, eller valde att dölja sin profil
    platform: Informationen du anger här kommer att vara publik. Du kan välja att dölja ditt konto, men vi rekommenderar att du är publik för att underlätta kommunikationen med andra medlemmar. Håll din information uppdaterad!

  makePublic:
    labelGlobal: Din profil visas publikt
    label: Din profil visas publikt i den har community
    helper: Om reglaget är påslaget kommer din profil att vara synlig för allmänheten
    helperGlobal: Om den stängs av kommer din profil att vara osynlig även internt

  menu:
    avatar: Profilbild
    about: Om mig
    contact: Kontaktinfo
    language: Språk
    options: Alternativ
    privacy: Integritet
    keywords:
      label: Nyckelord
      description: Här kan du lägga till nyckelord som visar dina kunskaper och intressen, eller vad du vill att andra personer kontaktar dig om. Nyckelorden kommer fungera som sökord för att hitta din profil. Skriv ett ord i taget!
      placeholder: Skriv något...

report:
  title: Rapportera {{ username }}
  titleGeneric: Skicka en rapport
  form:
    label: Beskriv problemet
    placeholder: Vad hände? Var så specifik som möjligt…
  messages:
    required: Beskriv problemet innan du skickar in.
    success: Rapport inskickad. Tack.


delete:
  action: Radera konto
  label: Bekräfta radering
  title: Är du säker?
  body: Du är på väg att permanent radera hela ditt konto och all data som är kopplad till det. Detta är en oåterkallelig handling. Är du säker?
  done: Ditt konto är raderat och du är utloggad. Tack för att du varit med!

emailLogin:
  withPassword: Administratör? Logga in med lösenord
  withEmail: Logga in med e-post i stället
  title: Logga in
  lead: Skriv in din e-postadress så skickar vi en länk som du kan logga in med.
  toSignup: Inget konto än? Skapa ett
  signup:
    title: Skapa konto
    lead: Skriv in din e-postadress så skickar vi en länk som du kan skapa ditt konto med.
    toLogin: Har du redan ett konto? Logga in
  terms: Genom att fortsätta godkänner du
  email:
    label: E-postadress
    placeholder: namn@exempel.se
    submit: Fortsätt med e-post
  code:
    title: Kolla din e-post
    lead: Vi har skickat en sexsiffrig kod till <strong>{{email}}</strong>. Skriv in den här, eller klicka på knappen i mejlet.
    label: Koden från mejlet
    digit: Siffra {{n}} av 6
    noMail: Inget mejl? Titta i skräpposten, eller
    resend: skicka en ny kod
    resendIn: du kan be om en ny kod om {{seconds}} s
    resent: Om adressen stämmer är ett nytt mejl på väg
    otherEmail: Använd en annan e-postadress
  confirm:
    title: Skapa ditt konto
    lead: Det finns inget konto för <strong>{{email}}</strong> än. Vill du skapa ett?
    factEmail: Du loggar in med den här e-postadressen – inget lösenord.
    factProfile: Ditt namn och din bild visas bara om du själv fyller i dem.
    factOrganizer: Innan du kan lägga upp egna evenemang måste en administratör godkänna dig som arrangör.
    factDelete: Du kan ta bort kontot när du vill under din profil.
    terms: Jag har läst och godkänner
    needTerms: Kryssa i att du godkänner villkoren för att skapa kontot.
    submit: Skapa mitt konto
    cancel: Avbryt, skapa inget konto
    expired: Koden har gått ut. Börja om och be om en ny kod.
  link:
    busy: Loggar in…
    failedTitle: Länken fungerar inte längre
    newCode: Få en ny kod
  password:
    title: Logga in med lösenord
    lead: Endast möjligt för administratörer.
    missing: Fyll i både användarnamn och lösenord.
    wrong: Fel användarnamn eller lösenord.
  errors:
    invalidCode: Koden stämmer inte eller har gått ut. Försök igen, eller be om en ny.
    invalidEmail: Det ser inte ut som en e-postadress.
    invalidLink: Inloggningslänkar fungerar en gång och i 15 minuter. Be om en ny kod så är du inne.
    tooMany: För många försök. Vänta en minut och försök igen.
    sendFailed: Vi kunde inte skicka mejlet. Försök igen om en stund.
    passwordDisabled: Lösenord används bara av administratörer. Logga in med din e-postadress i stället.

welcome:
  kicker: Ditt konto är skapat
  title: Välkommen till {{site}}!
  lead: Du är inloggad som <strong>{{email}}</strong>. Nästa gång loggar du in med samma adress.
  steps:
    profile:
      title: Fyll i din profil
      text: Lägg till namn och en bild så att andra känner igen dig.
    events:
      title: Hitta något att göra
      text: Se vad som händer i kalendern och anmäl dig till evenemang.
    organizer:
      title: Vill du lägga upp egna evenemang?
      text: Innan du kan lägga upp egna evenemang måste en administratör godkänna dig som arrangör. Hör av dig via Ge feedback längst ner på sidan.
  toProfile: Fyll i din profil
  toHome: Till startsidan
