<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const ICON = params.get('icon') || 'sevardhet';
const SIZE = Number(params.get('size') || 1024);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = Number(params.get('env') || (ICON === 'fotboll' ? 1 : 0.45));

// Soft studio light like the 3dicons renders: a big key from the upper
// left, a cool fill from the right, a rim from behind.
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 4, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(4, -1, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(2, 3, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 10);

// Colour the vertices along a diagonal, the gradient of the color style
function gradient(geometry, from, to, axis = new THREE.Vector3(1, 1, 0.3).normalize()) {
  geometry.computeBoundingBox();
  const pos = geometry.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  let min = Infinity, max = -Infinity;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) { const d = v.fromBufferAttribute(pos, i).dot(axis); min = Math.min(min, d); max = Math.max(max, d); }
  const a = new THREE.Color(from).convertSRGBToLinear(), b = new THREE.Color(to).convertSRGBToLinear(), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = (v.fromBufferAttribute(pos, i).dot(axis) - min) / (max - min);
    c.copy(a).lerp(b, t * t * (3 - 2 * t));
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

// ⌘, the Swedish sign for a sevärdhet: a centre square whose sides run
// on into a loop at every corner. Built as its outline with holes and
// extruded with a deep round bevel, like the 3dicons glyphs (hash, at).
function commandShape({ s = Number(params.get('s') || 0.72), r = Number(params.get('r') || 0.56), w = Number(params.get('w') || 0.18) } = {}) {
  const c = s + r;
  const q = 2 * Math.sqrt(r * w); // where the outer edges meet the loops
  const R = r + w;
  const shape = new THREE.Shape();
  const corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
  // Outer edge, counter-clockwise: right side up, loop top-right, top side
  // leftwards, loop top-left, …
  const x0 = s + w;
  shape.moveTo(x0, -(c - q));
  corners.forEach(([sx, sy], i) => {
    const cx = sx * c, cy = sy * c;
    // the point where the incoming straight edge meets this loop
    const inX = i % 2 === 0 ? sx * x0 : sx * (c - q);
    const inY = i % 2 === 0 ? sy * (c - q) : sy * x0;
    shape.lineTo(inX, inY);
    const outX = i % 2 === 0 ? sx * (c - q) : sx * x0;
    const outY = i % 2 === 0 ? sy * x0 : sy * (c - q);
    const a0 = Math.atan2(inY - cy, inX - cx);
    let a1 = Math.atan2(outY - cy, outX - cx);
    // go the long way round the outside of the loop, counter-clockwise
    while (a1 <= a0) a1 += Math.PI * 2;
    shape.absarc(cx, cy, R, a0, a1, false);
  });
  shape.closePath();
  // The holes: the middle square and the eye of each loop
  const h = s - w;
  const mid = new THREE.Path();
  mid.moveTo(h, h); mid.lineTo(-h, h); mid.lineTo(-h, -h); mid.lineTo(h, -h); mid.closePath();
  shape.holes.push(mid);
  corners.forEach(([sx, sy]) => {
    const eye = new THREE.Path();
    eye.absarc(sx * c, sy * c, r - w, 0, Math.PI * 2, true);
    shape.holes.push(eye);
  });
  return shape;
}

function buildSevardhet() {
  const geometry = new THREE.ExtrudeGeometry(commandShape(), {
    depth: 0.34, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.1,
    bevelSegments: 14, curveSegments: 96,
  });
  geometry.center();
  geometry.computeVertexNormals();
  gradient(geometry, params.get('from') || '#5a2a12', params.get('to') || '#e8a050');
  const material = new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: Number(params.get('rough') || 0.4), metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.25,
    sheen: 0.3, sheenColor: new THREE.Color('#ffd7b0'),
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.set(-0.42, 0.55, 0.1);
  return mesh;
}

// A football: 12 pentagons and 20 hexagons (a truncated icosahedron),
// painted onto a sphere as a texture, with dark seams pressed in.
function footballTexture(W = 2048, H = 1024) {
  const t = (1 + Math.sqrt(5)) / 2;
  const ico = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]]
    .map((p) => new THREE.Vector3(...p).normalize());
  const faces = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]]
    .map(([a, b, c]) => ico[a].clone().add(ico[b]).add(ico[c]).normalize());
  // the cells of a truncated icosahedron: pentagons around the 12 vertices,
  // hexagons around the 20 faces; a plane-distance test gives straight edges
  const pentD = Math.cos(0.3649); // angular radius at which pentagon planes cut
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const bump = ctx.createImageData(W, H);
  const p = new THREE.Vector3();
  // The facets as planes: each cell is where its centre's plane is nearest
  const centres = [...ico.map((v) => ({ v, d: 0.9393, pent: true })), ...faces.map((v) => ({ v, d: 0.9178, pent: false }))];
  for (let y = 0; y < H; y++) {
    const lat = Math.PI * (0.5 - (y + 0.5) / H);
    for (let x = 0; x < W; x++) {
      const lon = 2 * Math.PI * ((x + 0.5) / W) - Math.PI;
      p.set(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
      // the facet whose plane the ray from the centre meets first
      let best = Infinity, second = Infinity, pent = false;
      for (const c of centres) {
        const k = p.dot(c.v);
        if (k <= 0) continue;
        const dist = c.d / k;
        if (dist < best) { second = best; best = dist; pent = c.pent; } else if (dist < second) second = dist;
      }
      const edge = (second - best) * 220; // 0 at a seam
      const seam = Math.min(1, Math.max(0, (edge - 0.6) / 1.6));
      const i = (y * W + x) * 4;
      const base = pent ? [24, 32, 30] : [246, 244, 238];
      const s = 0.25 + 0.75 * seam;
      img.data[i] = base[0] * s + 20 * (1 - s); img.data[i + 1] = base[1] * s + 22 * (1 - s); img.data[i + 2] = base[2] * s + 22 * (1 - s); img.data[i + 3] = 255;
      const b = Math.round(255 * Math.pow(Math.min(1, edge / 6), 0.6));
      bump.data[i] = bump.data[i + 1] = bump.data[i + 2] = b; bump.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const map = new THREE.CanvasTexture(canvas); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8;
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; c2.getContext('2d').putImageData(bump, 0, 0);
  const bumpMap = new THREE.CanvasTexture(c2);
  return { map, bumpMap };
}

function buildFotboll() {
  const { map, bumpMap } = footballTexture();
  const material = new THREE.MeshPhysicalMaterial({
    map, bumpMap, bumpScale: 2.2, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.55, 256, 128), material);
  mesh.rotation.set(0.35, -0.5, 0.15);
  return mesh;
}


// A swim ring for Bad: a fat torus in alternating red and white, with
// thin bands of rope-white light at the joins pressed in a little.
function buildBadring() {
  const R = 1.25, tube = Number(params.get('tube') || 0.52), parts = Number(params.get('parts') || 8);
  const geometry = new THREE.TorusGeometry(R, tube, 96, 256);
  const pos = geometry.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const red = new THREE.Color(params.get('red') || '#d9604a').convertSRGBToLinear();
  const white = new THREE.Color('#f7f3ea').convertSRGBToLinear();
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const a = (Math.atan2(v.y, v.x) + Math.PI * 2) % (Math.PI * 2);
    const c = Math.floor(a / (Math.PI * 2 / parts)) % 2 ? white : red;
    colors.set([c.r, c.g, c.b], i * 3);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const material = new THREE.MeshPhysicalMaterial({
    vertexColors: true, roughness: Number(params.get('rough') || 0.42), clearcoat: Number(params.get('coat') || 0.5), clearcoatRoughness: 0.2,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.set(-0.75, 0.45, 0.2);
  return mesh;
}

// A hiking boot for Friluftsliv, seen from the side with the toe forward:
// the upper is its side profile extruded with a deep round bevel, on a
// dark lugged sole with a light midsole, a toe cap, a padded collar and
// laces across the instep.
function buildKanga() {
  const P = (k, d) => Number(params.get(k) || d);
  const W = P('width', 0.62); // the boot's width before the bevel
  const group = new THREE.Group();
  const extrude = (shape, depth, bevel, segs = 12) => {
    const g = new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8,
      bevelSegments: segs, curveSegments: 64,
    });
    g.translate(0, 0, -depth / 2);
    return g;
  };
  const glossy = (opts) => new THREE.MeshPhysicalMaterial({ roughness: 0.42, clearcoat: 0.45, clearcoatRoughness: 0.3, ...opts });

  // The upper, heel at the left, toe at the right
  const upper = new THREE.Shape();
  upper.moveTo(-1.05, 0.32);
  upper.bezierCurveTo(-1.22, 0.75, -1.18, 1.35, -1.02, 1.78); // heel and back of the shaft
  upper.quadraticCurveTo(-0.95, 1.95, -0.72, 1.93);            // round over the collar
  upper.lineTo(-0.2, 1.86);                                   // top of the shaft
  upper.quadraticCurveTo(-0.02, 1.84, 0.02, 1.62);             // the tongue's top
  upper.bezierCurveTo(0.12, 1.12, 0.55, 0.86, 0.98, 0.74);     // down the laces to the instep
  upper.quadraticCurveTo(1.38, 0.62, 1.4, 0.38);               // over the toe
  upper.lineTo(1.36, 0.3);
  upper.lineTo(-1.05, 0.3);
  const upperGeo = extrude(upper, W, 0.2);
  gradient(upperGeo, params.get('from') || '#5f8a3a', params.get('to') || '#a9c75a', new THREE.Vector3(0.6, 1, 0.2).normalize());
  group.add(new THREE.Mesh(upperGeo, glossy({ vertexColors: true })));

  // The tongue, standing a little above the shaft at the front
  const tongue = new THREE.Shape();
  tongue.moveTo(-0.32, 1.5);
  tongue.quadraticCurveTo(-0.3, 2.06, 0.02, 2.02);
  tongue.quadraticCurveTo(0.16, 1.98, 0.12, 1.5);
  tongue.lineTo(-0.32, 1.5);
  group.add(new THREE.Mesh(extrude(tongue, W - 0.3, 0.14), glossy({ color: params.get('tongue') || '#e9d6a0', roughness: 0.5 })));

  // The padded collar: a soft roll round the top of the shaft
  const collarCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.1, 1.9, W / 2 + 0.17),
    new THREE.Vector3(-0.6, 2.02, W / 2 + 0.2),
    new THREE.Vector3(-1.05, 1.95, W / 2 + 0.05),
    new THREE.Vector3(-1.2, 1.88, 0),
    new THREE.Vector3(-1.05, 1.95, -W / 2 - 0.05),
    new THREE.Vector3(-0.6, 2.02, -W / 2 - 0.2),
    new THREE.Vector3(-0.1, 1.9, -W / 2 - 0.17),
  ]);
  group.add(new THREE.Mesh(new THREE.TubeGeometry(collarCurve, 96, 0.11, 24, false), glossy({ color: params.get('collar') || '#5b3a26', roughness: 0.55 })));

  // The toe cap
  const cap = new THREE.Shape();
  cap.moveTo(0.78, 0.3);
  cap.quadraticCurveTo(0.82, 0.74, 1.05, 0.73);
  cap.quadraticCurveTo(1.42, 0.64, 1.44, 0.38);
  cap.lineTo(1.4, 0.3);
  cap.lineTo(0.78, 0.3);
  group.add(new THREE.Mesh(extrude(cap, W + 0.05, 0.2), glossy({ color: params.get('collar') || '#5b3a26', roughness: 0.55 })));

  // The midsole, light, and the dark sole under it with a heel step
  const mid = new THREE.Shape();
  mid.moveTo(-1.12, 0.18); mid.lineTo(1.42, 0.18);
  mid.quadraticCurveTo(1.56, 0.2, 1.52, 0.36);
  mid.lineTo(-1.12, 0.36); mid.lineTo(-1.12, 0.18);
  group.add(new THREE.Mesh(extrude(mid, W + 0.1, 0.14), glossy({ color: '#efe6d6', roughness: 0.5 })));
  const sole = new THREE.Shape();
  sole.moveTo(-1.15, -0.02); sole.lineTo(-0.3, -0.02); sole.lineTo(-0.26, 0.06);
  sole.lineTo(1.2, 0.06);
  sole.quadraticCurveTo(1.62, 0.05, 1.58, 0.26);
  sole.lineTo(-1.15, 0.22); sole.lineTo(-1.15, -0.02);
  const soleGeo = extrude(sole, W + 0.12, 0.12);
  group.add(new THREE.Mesh(soleGeo, glossy({ color: '#2f2622', roughness: 0.7, clearcoat: 0.1 })));
  // lugs under the sole
  const lugMat = glossy({ color: '#2a211d', roughness: 0.75, clearcoat: 0 });
  for (const x of [-1.0, -0.72, -0.48, 0.0, 0.32, 0.64, 0.96, 1.24]) {
    const lug = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, W + 0.32, 2, 2, 2), lugMat);
    lug.position.set(x, x < -0.3 ? -0.06 : 0.02, 0);
    group.add(lug);
  }

  // Laces across the instep, sitting on the front of the upper
  const laceMat = glossy({ color: params.get('lace') || '#d9604a', roughness: 0.4 });
  const front = new THREE.CubicBezierCurve(new THREE.Vector2(0.02, 1.62), new THREE.Vector2(0.12, 1.12), new THREE.Vector2(0.55, 0.86), new THREE.Vector2(0.98, 0.74));
  for (const t of [0.08, 0.26, 0.44, 0.62]) {
    const p = front.getPoint(t), d = front.getTangent(t);
    const n = new THREE.Vector2(-d.y, d.x); // outward, to the upper right
    const lace = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, W + 0.12, 8, 24), laceMat);
    lace.rotation.x = Math.PI / 2;
    lace.position.set(p.x + n.x * P('laceOut', 0.2), p.y + n.y * P('laceOut', 0.2), 0);
    group.add(lace);
  }

  group.rotation.set(P('rx', 0.3), P('ry', -0.62), P('rz', 0.04));
  return group;
}

// A spruce (gran) for Friluftsliv: tiers turned on a lathe, each a soft
// skirt with a rounded rim, on a short trunk.
function buildGran() {
  const P = (k, d) => Number(params.get(k) || d);
  const group = new THREE.Group();
  const tiers = P('tiers', 4);
  const tierGeo = (R, h, rim) => {
    const pts = [new THREE.Vector2(0.001, h)];
    // the slope, slightly hollow like a spruce's branches
    for (let i = 1; i <= 16; i++) {
      const t = i / 16;
      pts.push(new THREE.Vector2((R - rim) * t, h - (h - rim) * Math.pow(t, 0.85)));
    }
    // the rounded rim, out and under
    for (let i = 1; i <= 12; i++) {
      const a = Math.PI / 2 - (Math.PI * i) / 12;
      pts.push(new THREE.Vector2(R - rim + rim * Math.cos(a), rim + rim * Math.sin(a) - rim));
    }
    pts.push(new THREE.Vector2((R - rim) * 0.6, -rim * 0.4));
    pts.push(new THREE.Vector2(0.001, -rim * 0.2));
    return new THREE.LatheGeometry(pts.reverse(), 96);
  };
  const greens = [params.get('from') || '#2f6b3a', params.get('to') || '#8cc25a'];
  let y = 0.55;
  for (let i = 0; i < tiers; i++) {
    const t = i / (tiers - 1);
    const R = THREE.MathUtils.lerp(1.25, 0.55, t);
    const h = THREE.MathUtils.lerp(1.15, 0.95, t);
    const g = tierGeo(R, h, 0.16);
    g.translate(0, y, 0);
    group.add(new THREE.Mesh(g, null));
    y += h * 0.52;
  }
  // one gradient over all the tiers, bottom dark to top light
  const merged = [];
  group.children.forEach((m) => merged.push(m.geometry));
  group.clear();
  const material = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.3 });
  merged.forEach((g) => {
    gradient(g, greens[0], greens[1], new THREE.Vector3(-0.3, 1, 0.4).normalize());
    group.add(new THREE.Mesh(g, material));
  });
  // re-tint so the gradient runs over the whole tree, not per tier
  const all = new THREE.Box3(); merged.forEach((g) => { g.computeBoundingBox(); all.union(g.boundingBox); });
  const a = new THREE.Color(greens[0]).convertSRGBToLinear(), b = new THREE.Color(greens[1]).convertSRGBToLinear(), c = new THREE.Color(), v = new THREE.Vector3();
  const axis = new THREE.Vector3(-0.35, 1, 0.45).normalize();
  let min = Infinity, max = -Infinity;
  merged.forEach((g) => { const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const d = v.fromBufferAttribute(p, i).dot(axis); min = Math.min(min, d); max = Math.max(max, d); } });
  merged.forEach((g) => { const p = g.attributes.position, col = g.attributes.color; for (let i = 0; i < p.count; i++) { const tt = (v.fromBufferAttribute(p, i).dot(axis) - min) / (max - min); c.copy(a).lerp(b, tt); col.setXYZ(i, c.r, c.g, c.b); } col.needsUpdate = true; });
  const trunk = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.55, 8, 32), new THREE.MeshPhysicalMaterial({ color: '#7a4a2a', roughness: 0.5, clearcoat: 0.3 }));
  trunk.position.y = 0.35;
  group.add(trunk);
  group.rotation.set(P('rx', 0.28), P('ry', 0.4), P('rz', -0.12));
  return group;
}

// A tent: an A-frame of two soft panels with a dark door, on a groundsheet
function buildTalt() {
  const P = (k, d) => Number(params.get(k) || d);
  const group = new THREE.Group();
  const face = new THREE.Shape();
  face.moveTo(-1.3, 0); face.quadraticCurveTo(-0.55, 0.7, 0, 1.55); face.quadraticCurveTo(0.55, 0.7, 1.3, 0); face.lineTo(-1.3, 0);
  const door = new THREE.Path();
  door.moveTo(-0.42, 0.02); door.quadraticCurveTo(-0.18, 0.5, 0, 0.98); door.quadraticCurveTo(0.18, 0.5, 0.42, 0.02); door.lineTo(-0.42, 0.02);
  face.holes.push(door);
  const L = P('len', 1.6);
  const g = new THREE.ExtrudeGeometry(face, { depth: L, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 10, curveSegments: 64 });
  g.translate(0, 0, -L / 2);
  gradient(g, params.get('from') || '#c9501f', params.get('to') || '#f5a03c', new THREE.Vector3(0.4, 1, 0.3).normalize());
  group.add(new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.3 })));
  // the dark inside seen through the door
  const inside = new THREE.Shape();
  inside.moveTo(-0.44, 0.02); inside.quadraticCurveTo(-0.18, 0.5, 0, 1.0); inside.quadraticCurveTo(0.18, 0.5, 0.44, 0.02); inside.lineTo(-0.44, 0.02);
  const ig = new THREE.ShapeGeometry(inside, 32); ig.translate(0, 0, L / 2 - 0.25);
  group.add(new THREE.Mesh(ig, new THREE.MeshPhysicalMaterial({ color: '#3a1f12', roughness: 0.8 })));
  // the groundsheet: a rounded slab of grass
  const rr = (w, d, r) => { const sh = new THREE.Shape(); sh.moveTo(-w / 2 + r, -d / 2); sh.lineTo(w / 2 - r, -d / 2); sh.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r); sh.lineTo(w / 2, d / 2 - r); sh.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2); sh.lineTo(-w / 2 + r, d / 2); sh.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r); sh.lineTo(-w / 2, -d / 2 + r); sh.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2); return sh; };
  const sg = new THREE.ExtrudeGeometry(rr(3.0, L + 0.9, 0.35), { depth: 0.06, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 6, curveSegments: 24 });
  sg.rotateX(-Math.PI / 2);
  const sheet = new THREE.Mesh(sg, new THREE.MeshPhysicalMaterial({ color: params.get('ground') || '#7fae4a', roughness: 0.55, clearcoat: 0.3 }));
  sheet.position.y = -0.14;
  group.add(sheet);
  group.rotation.set(P('rx', 0.32), P('ry', -0.55), P('rz', 0));
  return group;
}

const builders = { sevardhet: buildSevardhet, fotboll: buildFotboll, badring: buildBadring, kanga: buildKanga, gran: buildGran, talt: buildTalt };
const object = (builders[ICON] || buildSevardhet)();
scene.add(object);

// Frame the object: fit its bounding sphere in the view
object.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(object, true);
const sphere = box.getBoundingSphere(new THREE.Sphere());
const dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.86;
camera.position.set(sphere.center.x, sphere.center.y, sphere.center.z + dist);
camera.lookAt(sphere.center);

renderer.render(scene, camera);
window.RENDERED = true;
</script>
